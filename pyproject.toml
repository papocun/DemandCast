[tool.poetry]
package-mode = false
name = "demandcast"
version = "0.1.0"
description = "Bike Sharing Demand Regression"
authors = ["Demandcast <demandcast@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "1.26.4"
pandas = "2.2.2"
scikit-learn = "1.4.0"
catboost = "1.2.8"
optuna = "4.3.0"
matplotlib = "3.8.2"
seaborn = "0.13.1"
jupyter = "1.0.0"
pytest = "7.4.4"
black = "24.1.1"
flake8 = "7.0.0"
pyarrow = "15.0.0"
pre-commit = "3.6.0"
ydata-profiling = "4.16.1"
dash = "3.0.0"
plotly = "6.1.2"
dash-bootstrap-components = "1.6.0"
pyyaml = "6.0.2"
python-dateutil = "2.8.2"
gunicorn = "23.0.0"
flask = "3.0.2"
requests = "2.31.0"
fastparquet = "^2024.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
